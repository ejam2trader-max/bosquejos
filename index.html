<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grace Scanner Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src='https://unpkg.com/tesseract.js@v4.0.1/dist/tesseract.min.js'></script>
    <style>
        .active-tab { border-bottom: 4px solid #4f46e5; color: #4f46e5; font-weight: bold; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.5s ease-out; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <header class="bg-indigo-700 text-white p-8 text-center shadow-xl">
        <h1 class="text-3xl font-black tracking-tighter uppercase">Grace Scanner</h1>
        <p class="text-[10px] tracking-[0.4em] opacity-70 uppercase font-bold mt-1">Hermenéutica del Nuevo Pacto</p>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">
        <div class="bg-white p-5 rounded-[2.5rem] shadow-sm border border-slate-100">
            <div id="camera-box" class="aspect-video bg-slate-900 rounded-[1.5rem] mb-4 overflow-hidden flex items-center justify-center relative">
                <video id="video" class="w-full h-full object-cover hidden" autoplay playsinline muted></video>
                <img id="preview" class="w-full h-full object-contain hidden">
                <p id="cam-status" class="text-slate-500 text-[10px] uppercase font-black tracking-widest">Cámara Lista</p>
            </div>

            <div class="grid grid-cols-2 gap-3 mb-4">
                <button onclick="activarCamara()" class="bg-indigo-600 text-white py-4 rounded-2xl font-bold text-[10px] uppercase shadow-lg active:scale-95 transition">Cámara</button>
                <button onclick="document.getElementById('file-in').click()" class="bg-slate-800 text-white py-4 rounded-2xl font-bold text-[10px] uppercase shadow-lg active:scale-95 transition">Galería</button>
                <input type="file" id="file-in" class="hidden" accept="image/*" onchange="leerArchivo(event)">
            </div>

            <textarea id="bible-text" rows="3" class="w-full p-5 bg-slate-50 border-0 rounded-2xl text-sm outline-none focus:ring-2 focus:ring-indigo-500 transition-all font-medium" placeholder="Pega el versículo o usa la cámara..."></textarea>
            
            <button id="btn-run" onclick="procesar()" class="w-full mt-4 bg-emerald-600 text-white py-6 rounded-3xl font-black text-xs uppercase shadow-2xl active:scale-95 transition tracking-widest">Generar Bosquejo</button>
        </div>

        <div id="results" class="hidden animate-fade-in pb-20">
            <div class="flex bg-white rounded-t-[2rem] overflow-hidden border-b border-slate-50 shadow-sm">
                <button onclick="tab('completo')" id="t-completo" class="flex-1 py-5 text-[10px] active-tab uppercase tracking-widest">Completo</button>
                <button onclick="tab('minimal')" id="t-minimal" class="flex-1 py-5 text-[10px] text-slate-400 uppercase tracking-widest">Minimal</button>
                <button onclick="tab('slides')" id="t-slides" class="flex-1 py-5 text-[10px] text-slate-400 uppercase tracking-widest">Slides</button>
            </div>
            <div id="c-completo" class="tab-content active bg-white p-7 rounded-b-[2rem] shadow-sm prose prose-indigo border border-slate-100 border-t-0 text-slate-700"></div>
            <div id="c-minimal" class="tab-content bg-white p-7 rounded-b-[2rem] shadow-sm italic text-xl text-indigo-900 border border-slate-100 border-t-0 font-serif"></div>
            <div id="c-slides" class="tab-content space-y-4 p-4"></div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
