<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grace Scanner Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src='https://unpkg.com/tesseract.js@v4.0.1/dist/tesseract.min.js'></script>
    <style>
        .active-tab { border-bottom: 4px solid #4f46e5; color: #4f46e5; font-weight: bold; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <header class="bg-indigo-700 text-white p-6 text-center shadow-lg">
        <h1 class="text-2xl font-black tracking-tighter">GRACE SCANNER PRO</h1>
        <p class="text-[10px] tracking-[0.3em] opacity-80 uppercase">Nuevo Pacto & Gracia</p>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">
        <div class="bg-white p-4 rounded-3xl shadow-sm border border-gray-100">
            <div id="camera-box" class="aspect-video bg-black rounded-2xl mb-4 overflow-hidden flex items-center justify-center relative">
                <video id="video" class="w-full h-full object-cover hidden" autoplay playsinline muted></video>
                <img id="preview" class="w-full h-full object-contain hidden">
                <p id="cam-status" class="text-gray-500 text-xs uppercase font-bold">Cámara Inactiva</p>
            </div>

            <div class="grid grid-cols-2 gap-2 mb-4">
                <button onclick="activarCamara()" class="bg-indigo-600 text-white py-3 rounded-xl font-bold text-xs uppercase shadow-md active:scale-95 transition">Cámara</button>
                <button onclick="document.getElementById('file-in').click()" class="bg-gray-800 text-white py-3 rounded-xl font-bold text-xs uppercase shadow-md active:scale-95 transition">Galería</button>
                <input type="file" id="file-in" class="hidden" accept="image/*" onchange="leerArchivo(event)">
            </div>

            <textarea id="bible-text" rows="3" class="w-full p-4 bg-gray-50 border-0 rounded-2xl text-sm outline-none focus:ring-2 focus:ring-indigo-500 transition-all" placeholder="Escribe o captura el versículo..."></textarea>
            
            <button id="btn-run" onclick="procesar()" class="w-full mt-4 bg-emerald-600 text-white py-5 rounded-2xl font-black text-sm shadow-xl active:scale-95 transition">GENERAR BOSQUEJO</button>
        </div>

        <div id="results" class="hidden animate-fade-in">
            <div class="flex bg-white rounded-t-3xl overflow-hidden border-b border-gray-100">
                <button onclick="tab('completo')" id="t-completo" class="flex-1 py-4 text-[10px] active-tab">COMPLETO</button>
                <button onclick="tab('minimal')" id="t-minimal" class="flex-1 py-4 text-[10px] text-gray-400">MINIMAL</button>
                <button onclick="tab('slides')" id="t-slides" class="flex-1 py-4 text-[10px] text-gray-400">SLIDES</button>
            </div>
            <div id="c-completo" class="tab-content active bg-white p-6 rounded-b-3xl shadow-sm prose prose-indigo border border-gray-100 border-t-0"></div>
            <div id="c-minimal" class="tab-content bg-white p-6 rounded-b-3xl shadow-sm italic text-lg text-indigo-900 border border-gray-100 border-t-0"></div>
            <div id="c-slides" class="tab-content space-y-3"></div>
        </div>
    </main>

    <canvas id="hidden-canvas" class="hidden"></canvas>
    <script src="app.js"></script>
</body>
</html>
