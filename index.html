<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grace Scanner Pro</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src='https://unpkg.com/tesseract.js@v4.0.1/dist/tesseract.min.js'></script>
    <style>
        .active-tab { border-bottom: 4px solid #6366f1; color: #6366f1; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-900">

    <header class="bg-indigo-600 text-white p-6 shadow-md text-center">
        <h1 class="text-2xl font-bold tracking-tight">GRACE SCANNER PRO</h1>
        <p class="text-xs opacity-90 uppercase tracking-widest">Enfoque en el Nuevo Pacto</p>
    </header>

    <main class="max-w-md mx-auto p-4 pb-20">
        <div class="bg-white rounded-2xl shadow-sm p-4 mb-6 border border-slate-200">
            <div id="camera-container" class="relative overflow-hidden rounded-xl bg-slate-100 aspect-video flex items-center justify-center">
                <video id="video" class="w-full hidden" autoplay playsinline></video>
                <canvas id="canvas" class="hidden"></canvas>
                <div id="placeholder" class="text-center p-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                    </svg>
                    <p class="text-sm text-slate-500 mt-2">Listo para escanear</p>
                </div>
            </div>
            <button id="main-btn" class="mt-4 bg-indigo-600 text-white w-full py-4 rounded-xl font-bold shadow-lg shadow-indigo-200 active:scale-95 transition-transform">
                ACTIVAR CÁMARA
            </button>
        </div>

        <div id="results-area" class="hidden">
            <div class="flex justify-between border-b mb-4">
                <button onclick="switchTab('completo')" id="btn-completo" class="tab-btn pb-2 flex-1 active-tab font-bold text-sm">COMPLETO</button>
                <button onclick="switchTab('minimal')" id="btn-minimal" class="tab-btn pb-2 flex-1 font-bold text-sm text-slate-500">MINIMAL</button>
                <button onclick="switchTab('slides')" id="btn-slides" class="tab-btn pb-2 flex-1 font-bold text-sm text-slate-500">SLIDES</button>
            </div>
