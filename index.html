<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grace Scanner PWA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src='https://unpkg.com/tesseract.js@v4.0.1/dist/tesseract.min.js'></script>
    <style>
        .active-tab { border-bottom: 4px solid #4f46e5; color: #4f46e5; }
        .hidden { display: none; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans">

    <header class="bg-indigo-700 text-white p-6 shadow-lg text-center">
        <h1 class="text-2xl font-bold tracking-tight">GRACE SCANNER</h1>
        <p class="text-xs opacity-80 uppercase tracking-widest">Enfoque Cristocéntrico & Nuevo Pacto</p>
    </header>

    <main class="max-w-md mx-auto p-4">
        <div class="bg-white rounded-2xl shadow-sm p-6 mb-6 text-center border-2 border-dashed border-indigo-200">
            <video id="video" class="w-full rounded-lg hidden" autoplay></video>
            <canvas id="canvas" class="hidden"></canvas>
            <div id="preview-container" class="mb-4">
                <div class="py-12 bg-indigo-50 rounded-lg text-indigo-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                    </svg>
                    <p class="text-sm mt-2">Captura un texto bíblico</p>
                </div>
            </div>
            <button id="capture-btn" class="bg-indigo-600 text-white px-6 py-3 rounded-full font-bold hover:bg-indigo-700 w-full transition">
                TOMAR FOTO
            </button>
        </div>

        <div id="results" class="hidden">
            <div class="flex justify-around mb-4 border-b">
                <button onclick="showTab('completo')" id="tab-completo" class="pb-2 px-2 active-tab font-medium">Completo</button>
                <button onclick="showTab('minimal')" id="tab-minimal" class="pb-2 px-2 font-medium">Minimalista</button>
                <button onclick="showTab('slides')" id="tab-slides" class="pb-2 px-2 font-medium">Slides</button>
            </div>

            <div id="content-completo" class="tab-content bg-white p-6 rounded-xl shadow-sm prose prose-indigo"></div>
            <div id="content-minimal" class="tab-content hidden bg-white p-6 rounded-xl shadow-sm italic text-lg text-gray-700"></div>
            <div id="content-slides" class="tab-content hidden space-y-4"></div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
